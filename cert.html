<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificates &amp; Achievements – Shindo Bajada Amacan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={darkMode:'media',theme:{extend:{fontFamily:{display:['Fraunces','Georgia','serif'],sans:['"DM Sans"','system-ui','sans-serif']},colors:{bg:'var(--bg)',ink:'var(--ink)',muted:'var(--muted)',line:'var(--line)',accent:'var(--accent)',pink:'var(--pink)',glow:'var(--glow)',surface:'var(--surface)',onaccent:'var(--on)'}}}}
</script>
<style>
:root{color-scheme:dark;--bg:#0e0e10;--surface:#1a1815cc;--ink:#f2ede4;--muted:#a59f93;--line:#312d27;--accent:#dcb572;--pink:#e5906e;--glow:#4a3720;--on:#15110b;--b1:#5a3d18;--b2:#7a3f2c;--b3:#4a3720;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth}
body{background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.blob{position:fixed;border-radius:9999px;filter:blur(80px);pointer-events:none;z-index:-1;opacity:.65;animation:float 18s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(40px,30px) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s ease both}.d1{animation-delay:.12s}.d2{animation-delay:.24s}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--pink));z-index:40}
#cur{position:fixed;left:-400px;top:-400px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none;z-index:-1;transform:translate(-50%,-50%);opacity:.8}
@media (hover:none){#cur{display:none}}
.eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--pink);font-weight:700;margin-bottom:10px}
.grad{background:linear-gradient(100deg,var(--accent),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
header nav a{background:linear-gradient(var(--pink),var(--pink)) 0 100%/0 2px no-repeat;padding-bottom:2px;transition:background-size .3s ease,color .25s ease}
header nav a.on{color:var(--accent);background-size:100% 2px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}.rv.in{opacity:1;transform:none}
.sec{display:flex;align-items:center;gap:14px;margin:56px 0 22px}
.sec h2{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0}
.sec i{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec span{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent);border:1px solid var(--line);border-radius:9999px;padding:4px 12px;background:var(--surface)}
/* certificate cards */
.cert{position:relative;overflow:hidden;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(16px);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .2s ease,border-color .25s ease,box-shadow .25s ease}
.cert::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(220,181,114,.28),transparent 60%)}
.open{position:relative;overflow:hidden;display:grid;place-items:center;width:100%;aspect-ratio:4/3;background:var(--glow);cursor:zoom-in;padding:0;border:0}
.open img{position:absolute;inset:0;width:100%;height:100%;transition:transform .5s ease}
.open::after{content:"View full size ↗";position:absolute;left:0;right:0;bottom:0;padding:10px 12px;text-align:center;font-size:13px;font-weight:700;color:var(--on);background:var(--accent);transform:translateY(100%);transition:transform .25s ease}
.cert figcaption{display:flex;align-items:baseline;gap:12px;padding:16px 20px}
.cert .no{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:700;color:var(--pink)}
.cert h3{margin:0;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:19px;line-height:1.25;transition:color .25s ease}
@media (hover:hover){
  header nav a:hover{background-size:100% 2px;color:var(--ink)}
  .cert:hover{--ty:-6px;border-color:var(--accent);box-shadow:0 22px 50px -18px var(--accent)}
  .cert:hover::before{opacity:1}
  .cert:hover .open img{transform:scale(1.07)}
  .cert:hover .open::after{transform:none}
  .cert:hover h3{color:var(--accent)}
}
/* lightbox */
dialog{background:transparent;border:0;padding:0;max-width:100vw;max-height:100vh;margin:auto;overflow:visible}
dialog::backdrop{background:rgba(8,6,4,.9);backdrop-filter:blur(6px)}
.lbw{position:relative;text-align:center}
.lbw img{max-width:92vw;max-height:76vh;border-radius:20px;box-shadow:0 30px 80px -20px #000;transition:opacity .25s ease}
.nb{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-size:22px;cursor:pointer;backdrop-filter:blur(8px);transition:background-color .25s ease,color .25s ease,transform .25s ease}
#pv{left:-10px}#nx{right:-10px}
@media (min-width:900px){#pv{left:-62px}#nx{right:-62px}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:14px}
.cl{padding:8px 18px;border-radius:9999px;border:0;background:var(--accent);color:var(--on);font-weight:700;font-size:14px;cursor:pointer;transition:background-color .25s ease,transform .25s ease}
@media (hover:hover){.nb:hover{background:var(--accent);color:var(--on);transform:scale(1.1)}.cl:hover{background:var(--pink);transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none !important;animation:none !important}.rv{opacity:1;transform:none}.cert{transform:none !important}}
</style>
</head>
<body class="font-sans text-[17px] leading-relaxed text-ink">
<div id="prog"></div><div id="cur"></div>
<div class="blob w-[460px] h-[460px] -top-28 -right-24" style="background:var(--b1)"></div>
<div class="blob w-[380px] h-[380px] -bottom-28 -left-24" style="background:var(--b2);animation-delay:-6s"></div>
<div class="blob w-[300px] h-[300px] top-1/2 left-1/2" style="background:var(--b3);opacity:.4;animation-delay:-11s"></div>

<header class="sticky top-0 z-20 bg-surface backdrop-blur-xl border-b border-line" style="top:env(safe-area-inset-top,0px)">
<div class="max-w-5xl mx-auto px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
<a href="index.html" class="font-display font-bold italic text-xl text-ink no-underline">✦ Shindo Amacan</a>
<nav aria-label="Sections" class="flex flex-wrap gap-5 text-[15px] font-medium">
<a class="text-muted no-underline" href="index.html#skills">Skills</a>
<a class="text-muted no-underline" href="index.html#work">Projects</a>
<a class="on no-underline" href="cert.html" aria-current="page">Certificates</a>
<a class="text-muted no-underline" href="doc.html">Documents</a>
<a class="text-muted no-underline" href="index.html#contact">Contact</a>
</nav>
</div>
</header>

<main class="max-w-5xl mx-auto px-6 pt-12 pb-10">
<p class="eyebrow rise">✦ The proof</p>
<h1 class="rise d1 font-display font-bold text-[clamp(38px,6.5vw,66px)] leading-[1.05] tracking-tight">Certificates &amp; <span class="grad">achievements</span></h1>
<p class="rise d2 text-muted text-xl max-w-xl mt-4">Tap any certificate to see it full size, then flip through them with the arrows.</p>

<!-- ============ CISCO CERTIFICATES ============ -->
<div class="sec rv"><h2>Cisco Certificates</h2><i></i><span>3</span></div>
<div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">

<figure class="cert rv">
<button type="button" class="open" aria-label="View English for IT1 full size"><img src="cert1.png" alt="English for IT1" class="object-cover" onerror="this.remove()"></button>
<figcaption><span class="no">01</span><h3>English for IT1</h3></figcaption>
</figure>

<figure class="cert rv">
<button type="button" class="open" aria-label="View Creating and Compelling Reports full size"><img src="cert3.png" alt="Creating and Compelling Reports" class="object-cover" onerror="this.remove()"></button>
<figcaption><span class="no">02</span><h3>Creating and Compelling Reports</h3></figcaption>
</figure>

<figure class="cert rv">
<button type="button" class="open" aria-label="View English for IT 2 full size"><img src="cert.png" alt="English for IT 2" class="object-cover" onerror="this.remove()"></button>
<figcaption><span class="no">03</span><h3>English for IT 2</h3></figcaption>
</figure>

</div>

<!-- ============ OTHER CERTIFICATES ============
HOW TO ADD MORE:
1. Save the picture next to this file and name it cert6.png, cert7.png, and so on.
2. Copy one whole <figure>...</figure> block below and paste it after the last one.
3. Change the number in src, alt, aria-label and the title (h3).
A slot with no picture yet shows "Add certX.png" and is skipped in the preview.
-->
<div class="sec rv"><h2>Other certificates &amp; awards</h2><i></i><span>MORE</span></div>
<div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">

<figure class="cert rv">
<button type="button" class="open" aria-label="View Certificate 4 full size"><img src="cert4.png" alt="Certificate 4" class="object-contain" onload="this.nextElementSibling.remove()" onerror="this.remove()"><span class="text-muted text-sm px-4 text-center col-start-1 row-start-1">Add cert4.png</span></button>
<figcaption><span class="no">05</span><h3>Consistent Dean's Lister since first year.</h3></figcaption>
</figure>

<figure class="cert rv">
<button type="button" class="open" aria-label="View Certificate 5 full size"><img src="cert5.jpg" alt="Certificate 5" class="object-contain" onload="this.nextElementSibling.remove()" onerror="this.remove()"><span class="text-muted text-sm px-4 text-center col-start-1 row-start-1">Add cert5.png</span></button>
<figcaption><span class="no">05</span><h3>FCU SR CODM CHAMPION</h3></figcaption>
</figure>

</div>


</main>

<dialog id="lb" aria-label="Certificate preview">
<div class="lbw">
<div class="top"><span id="cap"></span><span><span id="cnt"></span> &nbsp; <button type="button" class="cl" id="cl">Close</button></span></div>
<button type="button" class="nb" id="pv" aria-label="Previous certificate">‹</button>
<img id="lbimg" src="" alt="">
<button type="button" class="nb" id="nx" aria-label="Next certificate">›</button>
</div>
</dialog>

<script>
(function(){var d=document,P=d.getElementById('prog'),C=d.getElementById('cur');
addEventListener('scroll',function(){var h=d.documentElement;P.style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});
addEventListener('pointermove',function(e){C.style.left=e.clientX+'px';C.style.top=e.clientY+'px'});
/* scroll reveal with a small stagger */
var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.1});
d.querySelectorAll('.rv').forEach(function(s,n){if(s.classList.contains('cert'))s.style.transitionDelay=(n%3)*90+'ms';io.observe(s)});
/* 3D tilt + glare on hover devices */
if(matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
d.querySelectorAll('.cert').forEach(function(c){
c.addEventListener('pointermove',function(e){var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
c.style.setProperty('--ry',((x-.5)*8)+'deg');c.style.setProperty('--rx',((.5-y)*8)+'deg');c.style.setProperty('--mx',(x*100)+'%');c.style.setProperty('--my',(y*100)+'%')});
c.addEventListener('pointerleave',function(){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')})})}
/* lightbox with previous / next */
var lb=d.getElementById('lb'),li=d.getElementById('lbimg'),cap=d.getElementById('cap'),cnt=d.getElementById('cnt'),list=[],k=0;
function loaded(){return[].filter.call(d.querySelectorAll('.open img'),function(i){return i.complete&&i.naturalWidth>0})}
function show(n){k=(n+list.length)%list.length;var i=list[k];li.style.opacity=0;setTimeout(function(){li.src=i.src;li.alt=i.alt;li.style.opacity=1},120);cap.textContent=i.alt;cnt.textContent=(k+1)+' / '+list.length}
d.querySelectorAll('.open').forEach(function(b){b.addEventListener('click',function(){var img=b.querySelector('img');if(!img)return;list=loaded();var n=list.indexOf(img);if(n<0)return;lb.showModal();show(n)})});
d.getElementById('pv').onclick=function(){show(k-1)};d.getElementById('nx').onclick=function(){show(k+1)};d.getElementById('cl').onclick=function(){lb.close()};
lb.addEventListener('click',function(e){if(e.target===lb)lb.close()});
addEventListener('keydown',function(e){if(!lb.open)return;if(e.key==='ArrowLeft')show(k-1);if(e.key==='ArrowRight')show(k+1)});
})();
</script>
</body>
</html>
